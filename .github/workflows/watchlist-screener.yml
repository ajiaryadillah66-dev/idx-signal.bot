name: Watchlist Screener

on:
  schedule:
    # Semua waktu di bawah pakai UTC. WIB = UTC+7.

    # 1) Jam 15:30 WIB (sore, sebelum market tutup)
    - cron: "30 8 * * 1-5"

    # 2) Jam 20:00 WIB (malam, setelah market tutup total)
    - cron: "0 13 * * 1-5"

  workflow_dispatch: {}   # biar bisa dijalankan manual dari tab Actions

jobs:
  watchlist-screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Watchlist Screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_watchlist_screener.py --telegram
