name: IDX Signal Screening

on:
  schedule:
    # Semua waktu di bawah pakai UTC. WIB = UTC+7.
    # Cek tiap 1 jam selama jam trading IDX (skip jam istirahat 11:30-13:30 WIB).
    - cron: "0 2 * * 1-5"   # 09:00 WIB
    - cron: "0 3 * * 1-5"   # 10:00 WIB
    - cron: "0 4 * * 1-5"   # 11:00 WIB
    - cron: "0 6 * * 1-5"   # 13:00 WIB
    - cron: "0 7 * * 1-5"   # 14:00 WIB
    - cron: "0 8 * * 1-5"   # 15:00 WIB

  workflow_dispatch: {}   # biar bisa dijalankan manual dari tab Actions

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
