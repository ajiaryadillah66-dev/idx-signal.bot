name: IDX Signal Screening

on:
  schedule:
    # Semua waktu di bawah pakai UTC. WIB = UTC+7.

    # 1) Jam 15:30 WIB (market masih buka) -> screening BSJP (BUY & REBOUND
    #    WATCH + confidence score)
    - cron: "30 8 * * 1-5"

    # 2) Jam 15:40 WIB (10 menit setelah laporan BSJP) -> saham kemarin
    #    merah lalu hari ini hijau + volume naik dari rata-rata 1 minggu
    - cron: "40 8 * * 1-5"

    # 3) Jam 08:15 WIB (sebelum market buka) -> screening SELL/overbought
    #    + pola candle Doji/Hammer dari candle penutupan kemarin
    - cron: "15 1 * * 1-5"

    # NOTE: alert intraday (tiap 15 menit) DIMATIKAN sesuai permintaan --
    # sekarang cuma 3 laporan terjadwal per hari (15:30, 15:40, & 08:15).
    # Mode "intraday" tetap ada di kode dan bisa dites manual lewat
    # workflow_dispatch di bawah kalau suatu saat mau diaktifkan lagi.

  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: evening / reversal / morning / intraday"
        required: false
        default: "evening"

permissions:
  contents: write   # perlu buat commit balik state/notified_today.json

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine mode from trigger
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            hour=$(date -u +%H)
            minute=$(date -u +%M)
            if [ "$hour" -eq 8 ] && [ "$minute" -eq 30 ]; then
              echo "mode=evening" >> $GITHUB_OUTPUT
            elif [ "$hour" -eq 8 ] && [ "$minute" -eq 40 ]; then
              echo "mode=reversal" >> $GITHUB_OUTPUT
            elif [ "$hour" -eq 1 ] && [ "$minute" -eq 15 ]; then
              echo "mode=morning" >> $GITHUB_OUTPUT
            else
              echo "mode=intraday" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run screening
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py ${{ steps.mode.outputs.mode }}

      - name: Commit updated state (mode intraday only)
        if: steps.mode.outputs.mode == 'intraday'
        run: |
          git config user.name "idx-signal-bot"
          git config user.email "actions@github.com"
          if [ -f state/notified_today.json ]; then
            git add state/notified_today.json
            git diff --cached --quiet || git commit -m "chore: update notified state [skip ci]"
            git push
          fi
